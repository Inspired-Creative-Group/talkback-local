name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dev dependencies
        run: pip install -r requirements-dev.txt
      - name: bash -n
        run: bash -n install.sh hooks/*.sh bin/*
      - name: shellcheck
        run: shellcheck install.sh hooks/*.sh bin/*
      - name: ruff
        run: ruff check .
      - name: pytest
        run: pytest -q
