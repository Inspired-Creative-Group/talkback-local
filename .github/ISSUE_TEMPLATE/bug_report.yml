name: Something is wrong with the voice
description: It does not speak, speaks twice, cuts off, or sounds wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations: { required: true }
  - type: textarea
    id: log
    attributes:
      label: The last few lines of ~/.claude/automation/notifications/speak.log
      description: One "PLAY start"/"PLAY done" pair per reply is correct. Two is a bug.
      render: text
  - type: input
    id: mac
    attributes:
      label: Mac and macOS version
      placeholder: M1 Air, 16GB, macOS 15.2
    validations: { required: true }
  - type: checkboxes
    id: checked
    attributes:
      label: Quick checks
      options:
        - label: "`kokoro-server status` says it is running"
        - label: "`recmode` shows this session armed"
